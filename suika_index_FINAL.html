<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>수박게임</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: 'Jua', sans-serif;
    background: linear-gradient(180deg, #ffe9c7 0%, #ffd9a0 100%);
    display: flex; flex-direction: column; align-items: center;
    overflow: hidden; touch-action: none; user-select: none;
  }
  #topbar {
    width: 100%; max-width: 480px;
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 14px 4px; color: #7a4a12;
  }
  .scorebox { text-align: center; line-height: 1.1; }
  .scorebox .label { font-size: 12px; opacity: .7; }
  .scorebox .val { font-size: 26px; }
  #stage { position: relative; flex: 1; width: 100%; max-width: 480px; display: flex; justify-content: center; align-items: flex-start; }
  canvas { display: block; }
  #overlay {
    position: absolute; inset: 0; display: none;
    align-items: center; justify-content: center;
    background: rgba(60, 30, 0, .55);
  }
  #overlay.show { display: flex; }
  #panel {
    background: #fff8e7; border-radius: 16px; padding: 22px 26px;
    width: min(320px, 86%); text-align: center; color: #7a4a12;
    box-shadow: 0 10px 30px rgba(0,0,0,.3);
  }
  #panel h2 { font-size: 30px; margin-bottom: 4px; }
  #panel .final { font-size: 18px; margin-bottom: 14px; }
  #panel input {
    font-family: inherit; font-size: 16px; width: 100%;
    padding: 8px 10px; border: 2px solid #e8c78f; border-radius: 10px;
    margin-bottom: 8px; text-align: center; background: #fff;
  }
  #panel button {
    font-family: inherit; font-size: 16px; cursor: pointer;
    padding: 9px 18px; border: none; border-radius: 10px;
    background: #e0533d; color: #fff; margin: 3px;
  }
  #panel button.sub { background: #58a05c; }
  #panel button:disabled { opacity: .5; }
  #ranking { margin-top: 12px; text-align: left; font-size: 14px; max-height: 180px; overflow-y: auto; }
  #ranking .row { display: flex; justify-content: space-between; padding: 3px 6px; border-radius: 6px; }
  #ranking .row:nth-child(odd) { background: #f7ecd4; }
  #ranking .me { background: #ffd88a !important; }
  #lbmsg { font-size: 12px; opacity: .7; margin-top: 8px; }
  #rankHint { font-size: 14px; color: #b8641e; margin: -8px 0 12px; min-height: 18px; }
  #resetBtn {
    position: absolute; right: 10px; bottom: 10px; display: none;
    font-family: inherit; font-size: 13px; cursor: pointer;
    padding: 7px 12px; border: none; border-radius: 10px;
    background: #fff3da; color: #7a4a12; box-shadow: 0 3px 0 #e0cba0;
  }
  #resetBtn:active { transform: translateY(2px); box-shadow: 0 1px 0 #e0cba0; }
  #startOverlay {
    position: absolute; inset: 0; display: none;
    align-items: center; justify-content: center;
    background: linear-gradient(180deg, rgba(255,224,168,.96), rgba(255,205,140,.96));
  }
  #startOverlay.show { display: flex; }
  #startPanel { text-align: center; color: #7a4a12; width: min(320px, 86%); }
  #startTitle { font-size: 42px; margin-bottom: 6px; }
  #startSub { font-size: 15px; opacity: .8; margin-bottom: 22px; }
  #startPanel button {
    font-family: inherit; font-size: 18px; cursor: pointer; display: block;
    width: 100%; padding: 13px; border: none; border-radius: 12px;
    background: #e0533d; color: #fff; margin: 8px 0;
    box-shadow: 0 4px 0 #b83f2c;
  }
  #startPanel button:active { transform: translateY(2px); box-shadow: 0 2px 0 #b83f2c; }
  #startPanel button.ghost { background: #fff3da; color: #7a4a12; box-shadow: 0 4px 0 #e0cba0; }
  #startPanel button.ghost:active { box-shadow: 0 2px 0 #e0cba0; }
  #startRanking { margin-top: 14px; text-align: left; font-size: 14px; max-height: 220px; overflow-y: auto; }
  #startRanking .row { display: flex; justify-content: space-between; padding: 5px 10px; border-radius: 8px; }
  #startRanking .row:nth-child(odd) { background: rgba(255,255,255,.45); }
</style>
</head>
<body>
<div id="topbar">
  <div class="scorebox"><div class="label">점수</div><div class="val" id="score">0</div></div>
  <div class="scorebox"><div class="label">최고</div><div class="val" id="best">0</div></div>
</div>
<div id="stage">
  <canvas id="game"></canvas>
  <button id="resetBtn">⟳ 다시하기</button>
  <div id="startOverlay" class="show">
    <div id="startPanel">
      <div id="startTitle">🍉 수박게임</div>
      <div id="startSub">같은 과일을 합쳐 수박을 만들자!</div>
      <button id="startBtn">게임 시작</button>
      <button id="startRankBtn" class="ghost">리더보드 보기</button>
      <div id="startRanking"></div>
    </div>
  </div>
  <div id="overlay">
    <div id="panel">
      <h2 id="ovTitle">게임 오버</h2>
      <div class="final" id="ovScore"></div>
      <div id="rankHint"></div>
      <div id="lbArea">
        <input id="nick" maxlength="12" placeholder="닉네임 (최대 12자)">
        <button class="sub" id="submitBtn">랭킹 등록</button>
      </div>
      <button id="restartBtn">다시 하기</button>
      <div id="ranking"></div>
      <div id="lbmsg"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js"></script>
<script>
(() => {
  // ===== Supabase 설정 — 2048 때와 동일 패턴. 아래 두 값만 채우면 리더보드 활성화 =====
  const SUPABASE_URL = 'https://fpjgjwazqpfiffnsgume.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_I1YgcnYNBOaGy0WwozO2wQ_PGwsLtU5';
  const LB_TABLE = 'suika_rankings';
  const LB_ENABLED = !SUPABASE_URL.includes('YOUR-PROJECT');

  const { Engine, Bodies, Body, World, Events } = Matter;

  // ===== 보드/과일 상수 =====
  // 캔버스가 화면을 꽉 채우도록 화면 비율에 맞춰 논리 높이를 결정.
  // 그래야 박스(가운데 1/3)가 '실제 화면 폭의 1/3'이 됨.
  const stageEl = document.getElementById('stage');
  const W = 561;                                     // 논리 폭 (박스 = 정확히 W/3)
  const ASPECT = stageEl.clientHeight / Math.max(1, stageEl.clientWidth);
  const H = Math.min(1500, Math.max(680, Math.round(W * ASPECT)));
  const BX1 = W * 2 / 3;                             // 오른쪽 벽면 유지 (우측 열 보존)
  const BX0 = BX1 - 265;                             // 왼쪽 여백 활용 (187 → 265). 난이도 위해 280에서 축소
  const BOARD_TOP = 130;
  const BOX_H = Math.min(615, H - BOARD_TOP - 30);   // 높이 (430 → 615), 화면 여유 내에서
  const BOARD_BOT = BOARD_TOP + BOX_H;
  const WALL = 14;
  const DEADLINE = BOARD_TOP + 80;    // 게임오버 라인 y
  const DROP_Y = BOARD_TOP - 60;      // 드롭 대기 높이 (박스 위 공간)
  const FRUITS = [
    { name: '체리',     emoji: '🍒', r: 12 },
    { name: '딸기',     emoji: '🍓', r: 15 },
    { name: '포도',     emoji: '🍇', r: 18 },
    { name: '귤',       emoji: '🍊', r: 23 },
    { name: '감',       emoji: '🍅', r: 27 },
    { name: '사과',     emoji: '🍎', r: 33 },
    { name: '배',       emoji: '🍐', r: 41 },
    { name: '복숭아',   emoji: '🍑', r: 50 },
    { name: '파인애플', emoji: '🍍', r: 60 },
    { name: '멜론',     emoji: '🍈', r: 74 },
    { name: '수박',     emoji: '🍉', r: 90 },
  ];
  const MAX_LEVEL = FRUITS.length - 1;
  const DROPPABLE = 5;                                  // 1~5단계만 드롭 등장
  const mergeScore = lv => lv * (lv + 1) / 2;           // 삼각수: 결과 단계 lv 생성 시 점수
  const WATERMELON_BONUS = 100;

  // ===== 이모지 글리프 측정: 실루엣 볼록 껍질(convex hull) 추출 =====
  // 🍉는 반원, 🍍는 길쭉한 타원 — 원형 바디로는 보이는 모양과 쌓임이 어긋난다.
  // 알파 실루엣의 경계점에서 볼록 껍질 다각형을 뽑아 그 다각형을 물리 바디로 쓴다.
  // 넓이가 πr²(기존 원과 동일)이 되도록 스케일해 밸런스(질량·부피감)는 유지.
  function convexHull(pts) {
    pts = pts.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lower = [], upper = [];
    for (const p of pts) {
      while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], p) <= 0) lower.pop();
      lower.push(p);
    }
    for (let i = pts.length - 1; i >= 0; i--) {
      const p = pts[i];
      while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], p) <= 0) upper.pop();
      upper.push(p);
    }
    lower.pop(); upper.pop();
    return lower.concat(upper);
  }

  function measureGlyph(emoji) {
    const S = 100, C = Math.round(S * 1.8);
    // 폴백: 정20각형 (반지름 0.45 폰트단위)
    const FB_V = [];
    for (let i = 0; i < 20; i++) FB_V.push({ x: 0.45 * Math.cos(i / 20 * 2 * Math.PI), y: 0.45 * Math.sin(i / 20 * 2 * Math.PI) });
    const FALLBACK = { verts: FB_V, area: Math.PI * 0.45 * 0.45, cx: 0, cy: 0.04, hw: 0.45 };

    const c = document.createElement('canvas');
    c.width = c.height = C;
    const g = c.getContext('2d', { willReadFrequently: true });
    g.font = `${S}px serif`;
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(emoji, C / 2, C / 2);
    const d = g.getImageData(0, 0, C, C).data;

    // 행별 좌/우 경계점 수집 → 볼록 껍질
    const pts = [];
    for (let y = 0; y < C; y++) {
      let lo = -1, hi = -1;
      for (let x = 0; x < C; x++) {
        if (d[(y * C + x) * 4 + 3] > 10) { if (lo < 0) lo = x; hi = x; }
      }
      if (lo >= 0) { pts.push([lo, y], [hi + 1, y + 1]); }
    }
    if (pts.length < 6) return FALLBACK;
    let hull = convexHull(pts);
    if (hull.length < 3) return FALLBACK;
    if (hull.length > 20) {                       // 꼭짓점 수 제한 (물리 성능)
      const step = hull.length / 20;
      hull = Array.from({ length: 20 }, (_, i) => hull[Math.floor(i * step)]);
    }

    // 신발끈 공식: 넓이 + 무게중심
    let A = 0, cx = 0, cy = 0;
    for (let i = 0; i < hull.length; i++) {
      const p = hull[i], q = hull[(i + 1) % hull.length];
      const cr = p[0] * q[1] - q[0] * p[1];
      A += cr; cx += (p[0] + q[0]) * cr; cy += (p[1] + q[1]) * cr;
    }
    A /= 2;
    if (Math.abs(A) < 1) return FALLBACK;
    cx /= 6 * A; cy /= 6 * A;

    // 무게중심 원점 기준, 폰트 단위로 정규화
    const verts = hull.map(p => ({ x: (p[0] - cx) / S, y: (p[1] - cy) / S }));
    let minX = 1e9, maxX = -1e9;
    for (const v of verts) { if (v.x < minX) minX = v.x; if (v.x > maxX) maxX = v.x; }
    const area = Math.abs(A) / (S * S);
    const hw = Math.max(-minX, maxX);
    // 측정 검증 — 폰트/환경에 따라 글리프가 조각나면 수치가 붕괴한다.
    // 범위를 벗어나면 폴백(정20각형)으로 안전하게 후퇴 (정상 이모지: area 0.5~1.1, hw 0.3~0.8)
    if (area < 0.15 || area > 1.6 || hw < 0.25 || hw > 0.95) return FALLBACK;
    return {
      verts,
      area,
      cx: (cx - C / 2) / S,                       // 텍스트 앵커 → 무게중심 오프셋
      cy: (cy - C / 2) / S,
      hw,
    };
  }
  const GLYPH = FRUITS.map(f => measureGlyph(f.emoji));

  // 다각형 넓이 = πr² 이 되도록 폰트 크기 결정 (원형 시절과 동일 부피감)
  // 어떤 측정 오차에도 시각 크기가 폭주하지 않도록 배율을 1.6r~2.8r로 제한
  const FONT_PX = FRUITS.map((f, i) => Math.max(f.r * 1.6, Math.min(f.r * 2.8, f.r * Math.sqrt(Math.PI / GLYPH[i].area))));
  // 스폰 클램프용 반폭(px)
  const HALF_W = FRUITS.map((f, i) => GLYPH[i].hw * FONT_PX[i]);

  // ===== 색상 보존 스프라이트 =====
  // 큰 폰트로 fillText 하면 일부 기기(안드로이드 비트맵 이모지)에서 단색으로 폴백함
  // → 안전 크기(≤120px)로 한 번만 렌더한 뒤 drawImage 확대. 색상 보존 + 프레임 성능 ↑
  const SPRITE = FRUITS.map((f, i) => {
    const g = GLYPH[i];
    let minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9;
    for (const v of g.verts) {
      if (v.x < minX) minX = v.x; if (v.x > maxX) maxX = v.x;
      if (v.y < minY) minY = v.y; if (v.y > maxY) maxY = v.y;
    }
    const pad = 0.25;                        // 껍질 밖 안티앨리어싱 여유 (폰트 단위)
    minX -= pad; minY -= pad; maxX += pad; maxY += pad;
    const S2 = Math.min(120, FONT_PX[i]);    // 안전 폰트 크기
    const cv = document.createElement('canvas');
    cv.width = Math.max(2, Math.ceil((maxX - minX) * S2));
    cv.height = Math.max(2, Math.ceil((maxY - minY) * S2));
    const cc = cv.getContext('2d');
    cc.font = `${S2}px serif`;
    cc.textAlign = 'center';
    cc.textBaseline = 'middle';
    // 무게중심이 (-minX,-minY)·S2 지점에 오도록 텍스트 앵커 배치
    cc.fillText(f.emoji, (-minX - g.cx) * S2, (-minY - g.cy) * S2);
    return { cv, ox: minX, oy: minY, S2 };
  });

  // opts: { scale, mood, look, blink } — 표정/역동성(#2)
  function drawEmoji(lv, x, y, r, angle, opts) {
    const o = opts || {};
    const fontPx = FONT_PX[lv] * (r / FRUITS[lv].r);   // 미리보기 등 크기 변형 대응
    const sp = SPRITE[lv];
    const k = fontPx / sp.S2;
    ctx.save();
    ctx.translate(x, y);
    if (angle) ctx.rotate(angle);
    if (o.scale && o.scale !== 1) ctx.scale(o.scale, 1 / o.scale);   // 스쿼시&스트레치
    ctx.drawImage(sp.cv, sp.ox * fontPx, sp.oy * fontPx, sp.cv.width * k, sp.cv.height * k);
    drawFace(r, o);
    ctx.restore();
  }

  // 표정 — 중립(웃음) / 합체 직후(기쁨) / 데드라인 근처(당황)
  function drawFace(r, o) {
    const ex = r * 0.34, ey = -r * 0.10;
    const er = Math.max(2.4, r * 0.16);
    const mood = o.mood || 'calm';
    const look = o.look || 0;                       // 속도에 따른 눈동자 쏠림 (-1~1)
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    if (o.blink) {                                  // 깜빡임
      ctx.strokeStyle = '#3a2410';
      ctx.lineWidth = Math.max(1.4, r * 0.075);
      for (const s of [-1, 1]) {
        ctx.beginPath();
        ctx.moveTo(s * ex - er * 0.8, ey);
        ctx.lineTo(s * ex + er * 0.8, ey);
        ctx.stroke();
      }
    } else if (mood === 'happy') {                  // ^ ^
      ctx.strokeStyle = '#3a2410';
      ctx.lineWidth = Math.max(1.4, r * 0.085);
      for (const s of [-1, 1]) {
        ctx.beginPath();
        ctx.moveTo(s * ex - er * 0.85, ey + er * 0.5);
        ctx.lineTo(s * ex, ey - er * 0.55);
        ctx.lineTo(s * ex + er * 0.85, ey + er * 0.5);
        ctx.stroke();
      }
    } else {
      const wide = mood === 'panic' ? 1.28 : 1;
      for (const s of [-1, 1]) {
        ctx.beginPath();
        ctx.ellipse(s * ex, ey, er * wide, er * 1.12 * wide, 0, 0, Math.PI * 2);
        ctx.fillStyle = '#fffdf7';
        ctx.fill();
        ctx.beginPath();
        ctx.arc(s * ex + look * er * 0.4, ey + er * 0.12, er * 0.5, 0, Math.PI * 2);
        ctx.fillStyle = '#3a2410';
        ctx.fill();
      }
    }

    // 입
    ctx.strokeStyle = '#3a2410';
    ctx.lineWidth = Math.max(1.3, r * 0.07);
    ctx.beginPath();
    if (mood === 'panic') {
      ctx.ellipse(0, r * 0.33, r * 0.13, r * 0.17, 0, 0, Math.PI * 2);
      ctx.fillStyle = '#3a2410';
      ctx.fill();
    } else if (mood === 'happy') {
      ctx.arc(0, r * 0.20, r * 0.24, 0.15 * Math.PI, 0.85 * Math.PI);
      ctx.stroke();
    } else {
      ctx.arc(0, r * 0.20, r * 0.18, 0.2 * Math.PI, 0.8 * Math.PI);
      ctx.stroke();
    }

    // 볼터치 — 기쁨일 때만
    if (mood === 'happy' && r > 16) {
      ctx.fillStyle = 'rgba(240,110,110,.35)';
      for (const s of [-1, 1]) {
        ctx.beginPath();
        ctx.ellipse(s * r * 0.55, r * 0.16, r * 0.13, r * 0.09, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  // 과일 몸체의 표정/애니메이션 상태 계산
  function fruitOpts(body) {
    const now = performance.now();
    const r = FRUITS[body.level].r;
    const pop = Math.max(0, 1 - (now - body.popAt) / 260);
    const danger = body.bounds.min.y < DEADLINE + r * 0.6;
    return {
      scale: 1 + 0.22 * Math.sin(pop * Math.PI),
      mood: pop > 0.15 ? 'happy' : (danger ? 'panic' : 'calm'),
      look: Math.max(-1, Math.min(1, body.velocity.x / 4)),
      blink: ((now + body.blinkPhase) % 3600) < 130,
    };
  }

  // ===== 캔버스 =====
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  canvas.width = W; canvas.height = H;
  function layout() {
    const stage = document.getElementById('stage');
    const s = Math.min(stage.clientWidth / W, stage.clientHeight / H);
    canvas.style.width = W * s + 'px';
    canvas.style.height = H * s + 'px';
  }
  window.addEventListener('resize', layout);

  // ===== 물리 세계 =====
  const engine = Engine.create();
  const world = engine.world;
  engine.gravity.y = 1.1;
  engine.positionIterations = 12;     // 실제 파고듦(겹침)도 줄임(#3)
  engine.velocityIterations = 8;
  const wallOpt = { isStatic: true, friction: 0.4, render: {} };
  World.add(world, [
    Bodies.rectangle((BX0 + BX1) / 2, BOARD_BOT + 40, (BX1 - BX0) + 200, 80, wallOpt),     // 바닥면 = BOARD_BOT
    Bodies.rectangle(BX0 - 40, H / 2, 80, H * 2, wallOpt),                                 // 왼벽면 = BX0
    Bodies.rectangle(BX1 + 40, H / 2, 80, H * 2, wallOpt),                                 // 오른벽면 = BX1
  ]);

  // ===== 상태 =====
  let score = 0, best = 0, over = false, started = false;
  let currentLv = 0, nextLv = 0;
  let aimX = (BX0 + BX1) / 2;
  let canDrop = true;
  let overTimer = 0;
  let lastTime = 0;
  let effects = [];
  let confetti = [];                 // 수박 축하 파티클
  let flash = 0;                     // 수박 완성 화면 플래시 (0~1)
  let combo = 0, lastMergeAt = 0;    // 연쇄 콤보

  // ===== 사운드 (Web Audio 합성 — 파일 불필요) =====
  let audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { } }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }
  function tone(freq, dur, type, vol, delay) {
    if (!audioCtx) return;
    const t0 = audioCtx.currentTime + (delay || 0);
    const o = audioCtx.createOscillator(), gn = audioCtx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    gn.gain.setValueAtTime(vol || 0.15, t0);
    gn.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(gn); gn.connect(audioCtx.destination);
    o.start(t0); o.stop(t0 + dur);
  }
  const sfxDrop = () => tone(220, 0.07, 'triangle', 0.08);
  const sfxMerge = lv => {                          // 단계가 오를수록 높은 음
    const f = 300 * Math.pow(1.1, lv);
    tone(f, 0.12, 'sine', 0.15);
    tone(f * 1.5, 0.10, 'sine', 0.09, 0.04);
  };
  const sfxWatermelon = () => [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.22, 'triangle', 0.15, i * 0.09));

  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');

  let memBest = 0;
  function loadBest() {
    try { best = parseInt(localStorage.getItem('suika_best') || '0', 10); }
    catch { best = memBest; }
    bestEl.textContent = best;
  }
  function saveBest() {
    if (score <= best) return;
    best = score; bestEl.textContent = best;
    try { localStorage.setItem('suika_best', String(best)); } catch { memBest = best; }
  }

  // ===== 과일 생성 — 글리프 실루엣 다각형 바디 =====
  function spawnFruit(x, y, lv, fromMerge) {
    const opt = { restitution: 0.15, friction: 0.4, density: 0.0012, label: 'fruit' };
    let body = null;
    try {
      const s = FONT_PX[lv];
      const verts = GLYPH[lv].verts.map(p => ({ x: p.x * s, y: p.y * s }));
      body = Bodies.fromVertices(x, y, [verts], opt);
    } catch (e) { /* 폴백으로 */ }
    if (!body) body = Bodies.circle(x, y, FRUITS[lv].r, opt);   // 측정/분해 실패 시 원형
    body.level = lv;
    body.merged = false;
    body.bornAt = performance.now();
    body.popAt = fromMerge ? performance.now() : -1e9;
    body.blinkPhase = Math.random() * 3600;
    body.touched = fromMerge;
    World.add(world, body);
    return body;
  }

  function pickNext() { return Math.floor(Math.random() * DROPPABLE); }

  function drop() {
    if (!started || !canDrop || over) return;
    const hw = HALF_W[currentLv];
    const x = Math.max(BX0 + hw, Math.min(BX1 - hw, aimX));
    spawnFruit(x, DROP_Y, currentLv, false);
    sfxDrop();
    currentLv = nextLv;
    nextLv = pickNext();
    canDrop = false;
    setTimeout(() => { canDrop = true; }, 550);
  }

  // ===== 합체 =====
  Events.on(engine, 'collisionStart', e => {
    for (const pair of e.pairs) {
      const a = pair.bodyA, b = pair.bodyB;
      if (a.label === 'fruit') a.touched = true;
      if (b.label === 'fruit') b.touched = true;
      if (a.label !== 'fruit' || b.label !== 'fruit') continue;
      if (a.level !== b.level) continue;
      if (a.merged || b.merged) continue;         // 함정①: 한 프레임 3개 충돌 이중합체 방지
      if (a.level === MAX_LEVEL) continue;        // 수박끼리는 합체 없음
      a.merged = b.merged = true;
      const nl = a.level + 1;
      const mx = (a.position.x + b.position.x) / 2;
      const my = (a.position.y + b.position.y) / 2;
      World.remove(world, a); World.remove(world, b);
      spawnFruit(mx, my, nl, true);
      // 연쇄 콤보: 직전 합체로부터 0.9초 내면 x2, x3… 보너스 = 기본점수 × (콤보-1) / 2
      const now = performance.now();
      combo = now - lastMergeAt < 900 ? combo + 1 : 1;
      lastMergeAt = now;
      const bonus = Math.floor(mergeScore(nl) * (combo - 1) / 2);
      let pts = mergeScore(nl) + bonus;
      if (nl === MAX_LEVEL) pts += WATERMELON_BONUS;
      score += pts;
      scoreEl.textContent = score;
      effects.push({ x: mx, y: my, r: FRUITS[nl].r, t: 0, pts, combo });
      if (nl === MAX_LEVEL) {                        // 수박 완성 축하
        sfxWatermelon();
        flash = 1;
        for (let i = 0; i < 60; i++) {
          const ang = Math.random() * Math.PI * 2, sp = 3 + Math.random() * 7;
          confetti.push({
            x: mx, y: my,
            vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 4,
            rot: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.4,
            color: ['#e0533d', '#f4c542', '#58a05c', '#8e5bd6', '#ff8ab5'][i % 5],
            t: 0, life: 1100 + Math.random() * 500,
          });
        }
      } else {
        sfxMerge(nl);
      }
    }
  });

  // ===== 게임오버 판정 (함정②: 라인 위 '체류 시간'으로 판정) =====
  function checkGameOver(dt) {
    const now = performance.now();
    let danger = false;
    for (const body of world.bodies) {
      if (body.label !== 'fruit') continue;
      if (!body.touched) continue;
      if (now - body.bornAt < 800) continue;
      if (body.bounds.min.y < DEADLINE) { danger = true; break; }
    }
    overTimer = danger ? overTimer + dt : 0;
    if (overTimer > 1000) gameOver();
    return danger;
  }

  async function showRankHint() {
    const el = document.getElementById('rankHint');
    el.textContent = '';
    if (!LB_ENABLED || score <= 0) return;
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/${LB_TABLE}?select=score&order=score.desc&limit=100`, { headers: sbHeaders });
      const rows = await res.json();
      const above = rows.filter(r => r.score > score).length;
      if (above < rows.length || rows.length < 100) el.textContent = `이 점수는 리더보드 ${above + 1}위 상당!`;
    } catch { /* 힌트는 실패해도 무시 */ }
  }

  function gameOver() {
    over = true;
    saveBest();
    try { document.getElementById('nick').value = localStorage.getItem('suika_nick') || ''; } catch { }
    showRankHint();
    document.getElementById('ovScore').textContent = `최종 점수 ${score}점` + (score >= best ? ' — 최고 기록!' : '');
    document.getElementById('overlay').classList.add('show');
    document.getElementById('submitBtn').disabled = !LB_ENABLED;
    document.getElementById('lbmsg').textContent = LB_ENABLED ? '' : '리더보드 비활성 — 파일 상단 SUPABASE 설정을 채워주세요';
    if (LB_ENABLED) loadRanking();
  }

  function restart() {
    for (const body of [...world.bodies]) if (body.label === 'fruit') World.remove(world, body);
    score = 0; over = false; overTimer = 0; effects = [];
    confetti = []; flash = 0; combo = 0; lastMergeAt = 0;
    currentLv = pickNext(); nextLv = pickNext();
    scoreEl.textContent = 0;
    document.getElementById('overlay').classList.remove('show');
    document.getElementById('submitBtn').disabled = false;
  }

  // ===== 렌더링 =====
  function drawNextBox() {
    // 다음 과일 — 박스 옆 오른쪽, 실제 플레이 크기 그대로(#4)
    const cx = (BX1 + W) / 2, cy = BOARD_TOP + 90;
    ctx.fillStyle = '#7a4a12';
    ctx.font = '16px Jua, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('다음', cx, BOARD_TOP + 30);
    ctx.strokeStyle = '#d8b985';
    ctx.lineWidth = 2;
    ctx.setLineDash([4, 6]);
    ctx.beginPath();
    ctx.arc(cx, cy, 42, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
    drawEmoji(nextLv, cx, cy, FRUITS[nextLv].r, 0, { mood: 'happy' });
  }

  function drawEvoRing() {
    // 진화의 고리 — 우측 열, '다음' 아래(#4)
    const R = 54;
    const cx = (BX1 + W) / 2;
    const cy = Math.min(H - R - 32, BOARD_TOP + 250);   // 다음 과일(하단 BOARD_TOP+132)과 겹치지 않게
    ctx.beginPath();
    ctx.arc(cx, cy, R + 28, 0, Math.PI * 2);
    ctx.fillStyle = '#fff3da';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, Math.PI * 2);
    ctx.strokeStyle = '#d8b985';
    ctx.lineWidth = 2;
    ctx.setLineDash([4, 6]);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    FRUITS.forEach((f, i) => {
      const ang = -Math.PI / 2 + (i / FRUITS.length) * Math.PI * 2;
      ctx.font = `${13 + i * 1.4}px serif`;
      ctx.fillText(f.emoji, cx + Math.cos(ang) * R, cy + Math.sin(ang) * R);
    });
    ctx.fillStyle = '#7a4a12';
    ctx.font = '14px Jua, sans-serif';
    ctx.fillText('진화의 고리', cx, cy);
  }

  function render(danger) {
    // 박스 바깥 영역
    ctx.fillStyle = '#ffe4b8';
    ctx.fillRect(0, 0, W, H);
    // 박스 내부
    ctx.fillStyle = '#fff8e7';
    ctx.fillRect(BX0, BOARD_TOP, BX1 - BX0, BOARD_BOT - BOARD_TOP);
    // 벽
    ctx.fillStyle = '#c98d4b';
    ctx.fillRect(BX0 - WALL, BOARD_TOP, WALL, BOARD_BOT - BOARD_TOP + WALL);
    ctx.fillRect(BX1, BOARD_TOP, WALL, BOARD_BOT - BOARD_TOP + WALL);
    ctx.fillRect(BX0 - WALL, BOARD_BOT, BX1 - BX0 + WALL * 2, WALL);
    // 위험 틴트 — 데드라인 위 영역 경고
    if (danger) {
      ctx.fillStyle = 'rgba(224,60,40,.10)';
      ctx.fillRect(BX0, BOARD_TOP, BX1 - BX0, DEADLINE - BOARD_TOP);
    }
    // 데드라인
    ctx.strokeStyle = danger ? 'rgba(224,60,40,.9)' : 'rgba(224,60,40,.35)';
    ctx.lineWidth = danger ? 5 : 3;
    ctx.setLineDash([14, 10]);
    ctx.beginPath();
    ctx.moveTo(BX0, DEADLINE); ctx.lineTo(BX1, DEADLINE);
    ctx.stroke();
    ctx.setLineDash([]);

    drawNextBox();
    drawEvoRing();

    // 조준 밴드 + 대기 과일 — 과일 폭만큼 표시해 착지 범위 예측
    if (!over) {
      const f = FRUITS[currentLv];
      const hw = HALF_W[currentLv];
      const x = Math.max(BX0 + hw, Math.min(BX1 - hw, aimX));
      ctx.fillStyle = 'rgba(122,74,18,.07)';
      ctx.fillRect(x - hw, Math.max(DROP_Y, BOARD_TOP), hw * 2, BOARD_BOT - Math.max(DROP_Y, BOARD_TOP));
      ctx.strokeStyle = 'rgba(122,74,18,.2)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x, DROP_Y); ctx.lineTo(x, BOARD_BOT);
      ctx.stroke();
      ctx.globalAlpha = canDrop ? 1 : 0.45;
      drawEmoji(currentLv, x, DROP_Y, f.r, 0, { mood: 'calm', look: 0 });
      ctx.globalAlpha = 1;
    }

    // 과일 (함정③: body 각도 적용해 회전 표현)
    for (const body of world.bodies) {
      if (body.label === 'fruit') drawEmoji(body.level, body.position.x, body.position.y, FRUITS[body.level].r, body.angle, fruitOpts(body));
    }

    // 합체 이펙트
    for (const fx of effects) {
      const p = fx.t / 400;
      ctx.globalAlpha = 1 - p;
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 6 * (1 - p);
      ctx.beginPath();
      ctx.arc(fx.x, fx.y, fx.r * (0.6 + p * 0.8), 0, Math.PI * 2);
      ctx.stroke();
      ctx.fillStyle = '#7a4a12';
      ctx.font = '22px Jua, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(`+${fx.pts}` + (fx.combo >= 2 ? ` ×${fx.combo}` : ''), fx.x, fx.y - fx.r - 8 - p * 22);
      ctx.globalAlpha = 1;
    }

    // 수박 축하 — 컨페티 + 골드 플래시
    for (const cf of confetti) {
      ctx.save();
      ctx.globalAlpha = 1 - cf.t / cf.life;
      ctx.translate(cf.x, cf.y);
      ctx.rotate(cf.rot);
      ctx.fillStyle = cf.color;
      ctx.fillRect(-4, -2.5, 8, 5);
      ctx.restore();
    }
    if (flash > 0) {
      ctx.fillStyle = `rgba(255, 214, 90, ${(flash * 0.28).toFixed(3)})`;
      ctx.fillRect(0, 0, W, H);
    }
  }

  // ===== 메인 루프 =====
  function loop(t) {
    const dt = Math.min(32, t - lastTime || 16);
    lastTime = t;
    if (!over) Engine.update(engine, dt);
    effects = effects.filter(fx => (fx.t += dt) < 400);
    confetti = confetti.filter(c => {
      c.t += dt; c.x += c.vx; c.y += c.vy; c.vy += 0.25; c.rot += c.vr;
      return c.t < c.life;
    });
    if (flash > 0) flash = Math.max(0, flash - dt / 700);
    const danger = over ? false : checkGameOver(dt);
    render(danger);
    requestAnimationFrame(loop);
  }

  // ===== 입력 =====
  function toGameX(clientX) {
    const rect = canvas.getBoundingClientRect();
    return (clientX - rect.left) / rect.width * W;
  }
  canvas.addEventListener('pointerdown', e => { aimX = toGameX(e.clientX); });
  canvas.addEventListener('pointermove', e => { aimX = toGameX(e.clientX); });
  canvas.addEventListener('pointerup', e => { aimX = toGameX(e.clientX); drop(); });

  // ===== 리더보드 (Supabase REST — 피하기 게임과 동일 패턴) =====
  const sbHeaders = {
    'apikey': SUPABASE_KEY,
    'Authorization': `Bearer ${SUPABASE_KEY}`,
    'Content-Type': 'application/json',
  };
  let submittedName = null;
  async function loadRanking(targetId) {
    const el = document.getElementById(targetId || 'ranking');
    if (!LB_ENABLED) { el.innerHTML = '<div class="row">리더보드 비활성 — SUPABASE 설정 필요</div>'; return; }
    el.innerHTML = '<div class="row">불러오는 중…</div>';
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/${LB_TABLE}?select=name,score&order=score.desc,created_at.asc&limit=10`, { headers: sbHeaders });
      const rows = await res.json();
      el.innerHTML = rows.map((r, i) =>
        `<div class="row${r.name === submittedName ? ' me' : ''}"><span>${i + 1}. ${escapeHtml(r.name)}</span><span>${r.score}점</span></div>`
      ).join('') || '<div class="row">아직 기록이 없어요</div>';
    } catch {
      el.innerHTML = '<div class="row">랭킹을 불러오지 못했어요</div>';
    }
  }
  async function submitScore() {
    const name = document.getElementById('nick').value.trim();
    if (!name) return;
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    try {
      await fetch(`${SUPABASE_URL}/rest/v1/${LB_TABLE}`, {
        method: 'POST', headers: sbHeaders,
        body: JSON.stringify({ name, score }),
      });
      submittedName = name;
      try { localStorage.setItem('suika_nick', name); } catch { }
      document.getElementById('lbmsg').textContent = '등록 완료!';
      loadRanking();
    } catch {
      document.getElementById('lbmsg').textContent = '등록 실패 — 네트워크를 확인해주세요';
      btn.disabled = false;
    }
  }
  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  document.getElementById('submitBtn').addEventListener('click', submitScore);
  document.getElementById('restartBtn').addEventListener('click', restart);

  // ===== 시작 화면 =====
  function beginGame() {
    document.getElementById('startOverlay').classList.remove('show');
    document.getElementById('resetBtn').style.display = 'block';
    ensureAudio();                    // 사용자 제스처 시점에 오디오 활성 (자동재생 정책)
    started = true;
  }

  // 플레이 중 재시작 — 오터치 방지 2단계 확인
  let resetArmed = 0;
  document.getElementById('resetBtn').addEventListener('click', () => {
    const btn = document.getElementById('resetBtn');
    if (performance.now() - resetArmed < 2000) {
      restart(); btn.textContent = '⟳ 다시하기'; resetArmed = 0;
    } else {
      resetArmed = performance.now();
      btn.textContent = '정말요?';
      setTimeout(() => { if (resetArmed) { btn.textContent = '⟳ 다시하기'; resetArmed = 0; } }, 2000);
    }
  });
  document.getElementById('startBtn').addEventListener('click', beginGame);
  document.getElementById('startRankBtn').addEventListener('click', () => loadRanking('startRanking'));

  // ===== 부팅 =====
  layout();
  loadBest();
  currentLv = pickNext(); nextLv = pickNext();
  requestAnimationFrame(loop);
})();
</script>
